name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN || secrets.PUBLIC_APP_ORIGIN || 'https://app.habemusfisio.com' }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync assets to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.PROD_S3_BUCKET }} \
            --delete \
            --exclude "_astro/*" \
            --cache-control "no-cache,no-store,must-revalidate"

          aws s3 sync dist/_astro/ s3://${{ secrets.PROD_S3_BUCKET }}/_astro/ \
            --delete \
            --cache-control "max-age=31536000,immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_CF_DISTRIBUTION_ID }} \
            --paths "/*"
