name: Deploy Infrastructure

# Manual CDK deploys of the hosting stacks.
# Staging: dispatch on main.
# Production: dispatch on a vX.Y.Z tag, so the stack matches a released commit and the
# "production" environment (restrict it to v* tags; see infra/README.md) allows it:
#   gh workflow run deploy-infra.yml --ref v1.2.3 -f target=production
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Stack to deploy'
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  ci:
    name: CI
    # ci.yml's staging deploy job only runs on push, but nested jobs must still be granted its permissions.
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/ci.yml

  deploy-infra:
    name: CDK Deploy (${{ inputs.target }})
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    concurrency:
      group: deploy-infra-${{ inputs.target }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check ref
        env:
          TARGET: ${{ inputs.target }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$TARGET" = "production" ] && { [ "$REF_TYPE" != "tag" ] || [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; }; then
            echo "::error::Production infra deploys only from a vX.Y.Z tag (got $REF_TYPE $REF_NAME)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve stack name
        id: stack
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = "staging" ]; then
            echo "name=HorayaSiteStagingStack" >> "$GITHUB_OUTPUT"
          else
            echo "name=HorayaSiteStack" >> "$GITHUB_OUTPUT"
          fi

      - name: CDK Diff (preview changes)
        working-directory: infra
        env:
          STACK: ${{ steps.stack.outputs.name }}
        run: npx cdk diff "$STACK"
        continue-on-error: true

      - name: CDK Deploy
        working-directory: infra
        env:
          STACK: ${{ steps.stack.outputs.name }}
        run: npx cdk deploy "$STACK" --require-approval never
